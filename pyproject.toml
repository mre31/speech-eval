[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-eval"
version = "0.1.0"
description = "Standart Türkçe Telaffuz ve Fonetik Doğruluk Ölçer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.30.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "praat-parselmouth>=0.4.3",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "rich>=13.0.0"
]

[project.scripts]
speech-eval = "speech_eval.cli:main"

[tool.setuptools.packages.find]
include = ["speech_eval*", "web*"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu124"]
